name: deploy-app

on:
  push:
    branches: [main]
    paths: ["app/**"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Zip app
        run: cd app && zip -r ../app.zip .

      - name: Deploy to Lambda
        run: aws lambda update-function-code --function-name omar-stg-api --zip-file fileb://app.zip
